apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviewflow-worker
  namespace: interviewflow
  labels:
    app: interviewflow-worker
    component: background-jobs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interviewflow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: interviewflow-worker
        component: background-jobs
    spec:
      serviceAccountName: interviewflow-api
      terminationGracePeriodSeconds: 120  # Allow long-running jobs to drain

      containers:
        - name: worker
          image: us-east1-docker.pkg.dev/PROJECT_ID/interviewflow/api:IMAGE_TAG
          command: ["/app/bin/interview_flow"]
          args: ["start_iex"]
          env:
            - name: OBAN_ONLY
              value: "true"
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: interviewflow-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: interviewflow-secrets
                  key: redis-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: interviewflow-secrets
                  key: secret-key-base
            - name: AI_SERVICE_URL
              value: "http://interviewflow-ai.interviewflow.svc.cluster.local"
            - name: AI_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: interviewflow-secrets
                  key: ai-service-secret

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          livenessProbe:
            exec:
              command: ["/app/bin/interview_flow", "rpc", "InterviewFlow.Workers.QueueConfig.queues()"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8
          args:
            - "--structured-logs"
            - "--port=5432"
            - "PROJECT_ID:us-east1:interviewflow-production-db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
